name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  ELIXIR_VERSION: "1.20.2-otp-29"
  OTP_VERSION: "29.0.3"
  # System packages needed to compile NIFs pulled in by mix deps.get — chiefly
  # EXLA (builds a C++ shim against a downloaded XLA archive).
  APT_PACKAGES: build-essential automake autoconf pkg-config libssl-dev

jobs:
  compile:
    name: Compile · Format
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update || true; sudo apt-get install -y ${{ env.APT_PACKAGES }}
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build/dev
          key: ${{ runner.os }}-dev-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-dev-
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted

  credo:
    name: Credo
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update || true; sudo apt-get install -y ${{ env.APT_PACKAGES }}
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build/dev
          key: ${{ runner.os }}-dev-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-dev-
      - run: mix deps.get
      - run: mix credo --strict

  sobelow:
    name: Sobelow
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update || true; sudo apt-get install -y ${{ env.APT_PACKAGES }}
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build/dev
          key: ${{ runner.os }}-dev-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-dev-
      - run: mix deps.get
      # Config.HTTPS ignored deliberately (mirrors .sobelow-conf, which keeps
      # local `mix sobelow` runs in step): v1 serves plain HTTP on the LAN with
      # no auth and no TLS terminator in the deployment (url scheme "http" in
      # config/runtime.exs). TLS lands with a Cloudflare/Tailscale tunnel as a
      # fast-follow alongside auth; drop this ignore when that ships. Inline
      # `# sobelow_skip` comments (honoured by --skip) cover reviewed
      # low-confidence Traversal/CI.System hits in lib/retrieval_node/ingest.
      - run: mix sobelow --private --skip --exit --threshold medium --ignore Config.HTTPS

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    services:
      # PostgreSQL 18 with pgvector preinstalled — matches the app's store and
      # satisfies the migration's `vector >= 0.5.0` guard.
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update || true; sudo apt-get install -y ${{ env.APT_PACKAGES }}
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build/test
          key: ${{ runner.os }}-test-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-test-
      - run: mix deps.get
      # The `test` alias runs ecto.create + ecto.migrate before the suite; the
      # migrate step exercises the extension/HNSW setup against real pgvector.
      - run: mix test --warnings-as-errors

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update || true; sudo apt-get install -y ${{ env.APT_PACKAGES }}
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build/dev
          key: ${{ runner.os }}-dev-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-dev-
      - uses: actions/cache@v6
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-
      - run: mix deps.get
      - run: mix dialyzer --format github

  hex-audit:
    name: Hex audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update || true; sudo apt-get install -y ${{ env.APT_PACKAGES }}
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v6
        with:
          path: deps
          key: ${{ runner.os }}-deps-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-deps-
      - run: mix deps.get
      - run: mix hex.audit
      - run: mix deps.unlock --check-unused

  argus:
    name: Argus
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update || true; sudo apt-get install -y ${{ env.APT_PACKAGES }}
      - name: Install Souffle
        run: |
          # Souffle's PPA package links against libffi7, which Ubuntu 24.04
          # dropped; install the Ubuntu 20.04 build (checksum-pinned) first.
          curl -fsSLo /tmp/libffi7.deb http://archive.ubuntu.com/ubuntu/pool/main/libf/libffi/libffi7_3.3-4_amd64.deb
          echo "4584aa8fef1bf5086168ce2f7078cd2ebd78fdc4cc0d86d958d795d4e0b0f50d  /tmp/libffi7.deb" | sha256sum -c -
          sudo apt-get install -y /tmp/libffi7.deb
          sudo wget https://souffle-lang.github.io/ppa/souffle-key.public -O /usr/share/keyrings/souffle-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/souffle-archive-keyring.gpg] https://souffle-lang.github.io/ppa/ubuntu/ stable main" | sudo tee /etc/apt/sources.list.d/souffle.list
          sudo apt-get update
          sudo apt-get install -y souffle
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      # Separate cache key from the ubuntu-latest jobs: this job pins its
      # image, so NIFs built here must not be shared if ubuntu-latest moves.
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build/dev
          key: ${{ runner.os }}-ubuntu-24.04-argus-dev-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-ubuntu-24.04-argus-dev-
      - run: mix deps.get
      - run: mix argus --fail-above 0
