name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  ELIXIR_VERSION: "1.20.4-otp-29"
  OTP_VERSION: "29.1.2"
  # System packages needed to compile NIFs pulled in by mix deps.get — chiefly
  # EXLA (builds a C++ shim against a downloaded XLA archive).
  APT_PACKAGES: build-essential automake autoconf pkg-config libssl-dev

jobs:
  compile:
    name: Compile · Format
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update || true; sudo apt-get install -y ${{ env.APT_PACKAGES }}
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build/dev
          key: ${{ runner.os }}-dev-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-dev-
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted

  credo:
    name: Credo
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update || true; sudo apt-get install -y ${{ env.APT_PACKAGES }}
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build/dev
          key: ${{ runner.os }}-dev-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-dev-
      - run: mix deps.get
      - run: mix credo --strict

  sobelow:
    name: Sobelow
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update || true; sudo apt-get install -y ${{ env.APT_PACKAGES }}
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build/dev
          key: ${{ runner.os }}-dev-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-dev-
      - run: mix deps.get
      # Config.HTTPS ignored deliberately (mirrors .sobelow-conf, which keeps
      # local `mix sobelow` runs in step): v1 serves plain HTTP on the LAN with
      # no auth and no TLS terminator in the deployment (url scheme "http" in
      # config/runtime.exs). TLS lands with a Cloudflare/Tailscale tunnel as a
      # fast-follow alongside auth; drop this ignore when that ships. Inline
      # `# sobelow_skip` comments (honoured by --skip) cover reviewed
      # low-confidence Traversal/CI.System hits in lib/retrieval_node/ingest.
      - run: mix sobelow --private --skip --exit --threshold medium --ignore Config.HTTPS

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      # The tree-sitter NIF caches downloaded grammars under XDG_CACHE_HOME;
      # point it inside the workspace so the cache step below can persist them.
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
    services:
      # PostgreSQL 18 with pgvector preinstalled — matches the app's store and
      # satisfies the migration's `vector >= 0.5.0` guard.
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update || true; sudo apt-get install -y ${{ env.APT_PACKAGES }}
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build/test
          key: ${{ runner.os }}-test-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-test-
      - run: mix deps.get
      # Grammars are keyed on mix.lock: the cache path embeds the
      # tree_sitter_language_pack version, so a bump fetches a fresh set.
      - uses: actions/cache@v6
        with:
          path: .cache/tree-sitter-language-pack
          key: ${{ runner.os }}-grammars-${{ hashFiles('mix.lock') }}
      # Fails the job if any required grammar is still missing afterwards.
      - run: mix rn.grammars.prefetch
      # The `test` alias runs ecto.create + ecto.migrate before the suite; the
      # migrate step exercises the extension/HNSW setup against real pgvector.
      # :tree_sitter tests (real parsing: chunker + graph extractor) run here
      # now that the grammars are cached; :integration (model) tests do not.
      - run: mix test --warnings-as-errors --include tree_sitter

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update || true; sudo apt-get install -y ${{ env.APT_PACKAGES }}
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build/dev
          key: ${{ runner.os }}-dev-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-dev-
      - uses: actions/cache@v6
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-
      - run: mix deps.get
      - run: mix dialyzer --format github

  hex-audit:
    name: Hex audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update || true; sudo apt-get install -y ${{ env.APT_PACKAGES }}
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v6
        with:
          path: deps
          key: ${{ runner.os }}-deps-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-deps-
      - run: mix deps.get
      - run: mix hex.audit
      - run: mix deps.unlock --check-unused

  argus:
    name: Argus
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update || true; sudo apt-get install -y ${{ env.APT_PACKAGES }}
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      # Separate cache key from the ubuntu-latest jobs: this job pins its
      # image, so NIFs built here must not be shared if ubuntu-latest moves.
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build/dev
          key: ${{ runner.os }}-ubuntu-24.04-argus-dev-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-ubuntu-24.04-argus-dev-
      - run: mix deps.get
      - run: mix argus --fail-above 0
