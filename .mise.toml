[tools]
erlang = "29.0.3"
elixir = "1.20.2-otp-29"
# Secret scanner used by Ingest.Scrubber before embedding (falls back to regex without it).
gitleaks = "8.30.1"

[tasks.test]
description = "Run the test suite"
run = "mix test"

[env]
# Local DB connection and secrets (PGHOST, PGPASSWORD, ...). Copy .env.example.
_.file = ".env"
